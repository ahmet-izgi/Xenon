tasks:
  - id: repl-help
    command: /help
    assertions:
      answer_contains_any: ["可用命令", "/status", "/tools"]
  - id: repl-mode
    command: /mode
    assertions:
      answer_contains_any: ["react", "思考", "mode"]
  - id: repl-tools
    command: /tools
    assertions:
      answer_contains_any: ["read_file", "write_file", "工具"]
  - id: repl-cost
    command: /cost
    assertions:
      answer_contains_any: ["缓存", "cache", "费用", "cost"]
  - id: repl-status
    command: /status
    assertions:
      answer_contains_any: ["系统状态", "范式", "上下文"]
  - id: repl-permissions
    command: /permissions
    assertions:
      answer_contains_any: ["权限模式", "default", "accept_edits"]
  - id: repl-evidence
    command: /evidence
    assertions:
      answer_contains_any: ["证据", "链"]
  - id: repl-sessions
    command: /sessions
    assertions:
      answer_contains_any: ["会话"]
  - id: repl-context
    command: /context
    assertions:
      answer_contains_any: ["上下文", "消息"]
  - id: repl-cache
    command: /cache
    assertions:
      answer_contains_any: ["缓存", "COLD", "cache"]
  - id: repl-goal
    command: /goal
    assertions:
      answer_contains_any: ["目标"]
  - id: repl-plan
    command: /plan
    assertions:
      answer_contains_any: ["计划模式"]
  - id: repl-config
    command: /config
